# Cross-Border Data Router Agent — Deployment on RHOAI
#
# Deploys the ADK agent as a standard Deployment + Service + Route.
# The agent calls Laya GPU and Qwen vLLM endpoints on the same cluster.
#
# Prerequisites:
#   1. Build and push the agent image:
#      oc new-build --binary --name=cbdr-agent -n laya-demo
#      cd agent && oc start-build cbdr-agent --from-dir=. -n laya-demo --follow
#
#   2. Apply this manifest:
#      oc apply -f manifests/06-agent.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cbdr-agent
  namespace: laya-demo
  labels:
    app: cbdr-agent
    opendatahub.io/dashboard: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cbdr-agent
  template:
    metadata:
      labels:
        app: cbdr-agent
    spec:
      containers:
        - name: agent
          image: image-registry.openshift-image-registry.svc:5000/laya-demo/cbdr-agent:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            # Qwen 2.5 Coder 7B on RHOAI (via rh-maas-litellm)
            - name: MAAS_BASE_URL
              value: "https://maas.apps.ocp.qn6c5.sandbox1388.opentlc.com"
            - name: MAAS_URL_PATH
              value: "/private-assistant-ai-serving/qwen25-coder-7b/v1"
            - name: MAAS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: maas-apikey
                  key: api_key
            - name: MAAS_SSL_VERIFY
              value: "false"
            - name: MODEL_NAME
              value: "Qwen/Qwen2.5-Coder-7B-Instruct"
            # Laya GPU InferenceService (in-cluster URL)
            - name: LAYA_API_URL
              value: "https://laya-api-gpu-laya-demo.apps.ocp.qn6c5.sandbox1388.opentlc.com"
            # FastAPI
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: cbdr-agent
  namespace: laya-demo
  labels:
    app: cbdr-agent
spec:
  selector:
    app: cbdr-agent
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cbdr-agent
  namespace: laya-demo
  labels:
    app: cbdr-agent
spec:
  to:
    kind: Service
    name: cbdr-agent
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
