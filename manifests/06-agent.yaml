# Cross-Border Data Router Agent — Deployment on OpenShift
#
# Three-model architecture with confidence gating:
#   System 1 fast:  Laya 421M (5 typed questions, ~150ms)
#   System 1 deep:  DiffusionGemma 26B (same questions, ~10-26s, called
#                   automatically when Laya confidence < gate)
#   System 2:       Gemini (reasoning LLM, hosted API)
#   Policy:         Deterministic compliance rules (in-process)
#
# Prerequisites:
#   1. Create the Gemini API key secret:
#      oc create secret generic gemini-apikey -n laya-demo \
#        --from-literal=api_key=<YOUR_GEMINI_KEY>
#
#   2. Build and push the agent image:
#      oc new-build --binary --name=cbdr-agent -n laya-demo
#      cd agent && oc start-build cbdr-agent --from-dir=. -n laya-demo --follow
#
#   3. Apply this manifest:
#      oc apply -f manifests/06-agent.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cbdr-agent
  namespace: laya-demo
  labels:
    app: cbdr-agent
    opendatahub.io/dashboard: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cbdr-agent
  template:
    metadata:
      labels:
        app: cbdr-agent
    spec:
      containers:
        - name: agent
          image: image-registry.openshift-image-registry.svc:5000/laya-demo/cbdr-agent:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            # Gemini (System 2 — reasoning LLM)
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-apikey
                  key: api_key
            - name: MODEL_NAME
              value: "gemini-2.5-flash"
            # Laya (System 1 fast — 421M encoder, ~150ms)
            - name: LAYA_API_URL
              value: "https://laya-api-gpu-laya-demo.apps.ocp.qn6c5.sandbox1388.opentlc.com"
            # DiffusionGemma (System 1 deep — 26B, ~10-26s)
            - name: DIFFUSIONGEMMA_API_URL
              value: "https://dgemma-jev-user-rbanda.apps.ocp.cloud.rhai-tmm.dev"
            # Confidence gate — escalate to DiffusionGemma below this
            - name: CONFIDENCE_GATE
              value: "0.55"
            # MLflow Tracing (set URI to enable; leave commented to disable)
            # - name: MLFLOW_TRACKING_URI
            #   value: "https://mlflow-laya-demo.apps.ocp.<cluster>"
            # - name: MLFLOW_TRACKING_INSECURE_TLS
            #   value: "true"
            # - name: MLFLOW_EXPERIMENT_NAME
            #   value: "cross-border-data-router"
            # FastAPI
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: cbdr-agent
  namespace: laya-demo
  labels:
    app: cbdr-agent
spec:
  selector:
    app: cbdr-agent
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cbdr-agent
  namespace: laya-demo
  labels:
    app: cbdr-agent
spec:
  to:
    kind: Service
    name: cbdr-agent
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
