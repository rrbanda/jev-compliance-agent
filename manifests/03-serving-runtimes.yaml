---
# Playground ServingRuntime — Interactive web UI
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: laya-playground-runtime
  namespace: laya-demo
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: "Laya Interactive Playground"
spec:
  containers:
    - name: kserve-container
      image: image-registry.openshift-image-registry.svc:5000/laya-demo/laya:v0.3.22
      command: ["python", "/opt/laya/playground/server.py"]
      args: ["--host", "0.0.0.0", "--port", "8000"]
      ports:
        - containerPort: 8000
          protocol: TCP
      env:
        - name: LAYA_LOG_LEVEL
          value: "info"
      volumeMounts:
        - name: model-cache
          mountPath: /home/laya/.cache/huggingface
  multiModel: false
  supportedModelFormats:
    - name: laya-playground
      autoSelect: true
