[project]
name = "cross-border-data-router"
version = "0.2.0"
description = "Cross-border data-policy router powered by Laya (System 1) and Qwen (System 2) on RHOAI"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk[a2a,extensions]>=2.0.0,<3.0.0",
    "a2a-sdk>=0.3,<1",
    "python-dotenv>=1.0.0",
    "rh-maas-litellm @ git+https://github.com/rrbanda/rh-maas-litellm.git",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = "."
addopts = "--ignore=tests/integration"
filterwarnings = [
    "ignore:BaseAgentConfig is deprecated.*:DeprecationWarning",
]
